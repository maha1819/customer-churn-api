
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: customer-churn-api:latest
    container_name: churn-api-container
    ports:
      - "8000:8000"
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    image: customer-churn-streamlit:latest
    container_name: churn-streamlit-container
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000/predict
    depends_on:
      - api
    restart: unless-stopped
